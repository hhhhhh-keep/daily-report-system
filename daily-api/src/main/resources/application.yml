spring:
  application:
    name: daily-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  quartz:
    auto-startup: ${QUARTZ_AUTO_STARTUP:true}
    job-store-type: memory
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

daily:
  web-base-url: ${WEB_BASE_URL:http://localhost:8080}
  administrator:
    username: ${ADMIN_USERNAME:admin}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
  llm:
    endpoint: ${LLM_ENDPOINT:}
    model: ${LLM_MODEL:}
    api-key: ${LLM_API_KEY:}
    skill-request-timeout: ${LLM_SKILL_REQUEST_TIMEOUT:PT300S}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}

management:
  health:
    mail:
      enabled: ${SMTP_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
